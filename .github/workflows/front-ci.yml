name: front-ci-cd

on:
  push:
    branches:
      - front
  pull_request:
    paths:
      - "**"
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCS_BUCKET: ${{ secrets.BUCKET_ADMIN_WEB }}
  TEMPLATE_BUCKET: ${{ secrets.BUCKET_SITE_TEMPLATES || 'icore-site-templates' }}
  GCP_CDN_URL_MAP: ${{ secrets.GCP_CDN_URL_MAP }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || '/api' }}
        run: npm run build

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/front'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/front'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Upload dist to GCS
        if: github.event_name == 'push' && github.ref == 'refs/heads/front'
        run: |
          gsutil -m rsync -r -d ./dist gs://${{ env.GCS_BUCKET }}/
          gsutil -m setmeta -h "Cache-Control:no-cache, max-age=0" gs://${{ env.GCS_BUCKET }}/index.html
          gsutil -m setmeta -h "Cache-Control:public, max-age=31536000, immutable" gs://${{ env.GCS_BUCKET }}/assets/**

      - name: Upload landing template JSONs to GCS
        if: github.event_name == 'push' && github.ref == 'refs/heads/front'
        run: |
          gsutil -m rsync -r -d ./src/pages/templates gs://${{ env.TEMPLATE_BUCKET }}/templates
          gsutil -m setmeta -h "Cache-Control:no-cache, max-age=0" gs://${{ env.TEMPLATE_BUCKET }}/templates/*.json

      - name: Invalidate Cloud CDN cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/front' && env.GCP_CDN_URL_MAP != ''
        run: |
          gcloud compute url-maps invalidate-cdn-cache ${{ env.GCP_CDN_URL_MAP }} --path "/*" --async
